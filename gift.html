<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan để mở quà</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
    margin:0;
    height:100vh;
    background:black;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    font-family:Arial;
}

#qrcode{
    margin-top:20px;
}
</style>
</head>

<body>

<h2>💖 Quét QR để nhận quà 💖</h2>

<div id="qrcode"></div>

<script>
// LINK ĐẾN TRANG QUÀ
const link = window.location.origin + "/gift.html";

new QRCode(document.getElementById("qrcode"), {
    text: link,
    width: 250,
    height: 250,
    colorDark : "#ff0000",
    colorLight : "#000000"
});
</script>

</body>
</html>
